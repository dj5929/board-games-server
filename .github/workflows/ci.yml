name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Lint (engines + server)
      run: npm run lint

    - name: Lint (web-client)
      run: npm run lint --workspace web-client

    - name: Test
      run: npm run test

    - name: Build server
      run: npm run build --workspace @packages/server

    - name: Build web-client
      run: npm run build --workspace web-client